
<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valentines day! 💋</title>

  <link rel="icon" type="image/png" href="meuicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>

body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}


#rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  background: #111;
  color: white;
  z-index: 999;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  font-size: 24px;
}

@media screen and (orientation: portrait) and (max-width: 768px) {

  #rotateMessage {
    display: flex;
  }

}

#mainContent {

  width: 100vw;
  height: 100vh;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  position: relative;

  overflow: hidden;
}
.flor:hover {

  transform: scale(1.04);

  filter:
    brightness(1.08)
    drop-shadow(0 0 18px rgba(255,220,120,0.35));
}

#video-fundo {

  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  opacity: 0.15;

  z-index: -1;
}

h1 {

  color: white;

  font-family: 'Great Vibes', cursive;

  font-size: 60px;

  margin-bottom: 40px;

  z-index: 2;
}

#snoopy {

  width: 230px;

  cursor: pointer;

  position: relative;

  left: 0;

  transition: left 1.2s ease;

  z-index: 5;
}

.snoopy-saindo {

  left: 140vw;
}

#giftBox {

  position: fixed;

  width: 220px;

  right: -300px;
  bottom: 120px;

  z-index: 80;

  pointer-events: none;
}

#giftBox img {

  width: 100%;
}

.gift-voando {

  animation: jogarPresente 1.8s ease forwards;
}

@keyframes jogarPresente {

  0% {
    right: -300px;
    bottom: 120px;
    transform: rotate(0deg);
  }

  40% {
    right: 35vw;
    bottom: 380px;
    transform: rotate(-15deg);
  }

  100% {
    right: calc(50vw - 110px);
    bottom: 80px;
    transform: rotate(8deg);
  }

}

#messageText {

  position: fixed;

  left: 50%;
  bottom: 120px;

  transform: translateX(-50%) translateY(40px);

  opacity: 0;

  width: 340px;

  background: rgba(20,20,20,0.95);

  color: white;

  padding: 25px;

  border-radius: 20px;

  text-align: center;

  z-index: 120;

  transition:
    opacity 0.5s ease,
    transform 0.5s ease;
}

#messageText.active {

  opacity: 1;

  transform: translateX(-50%) translateY(0);
}

#closeBox {

  margin-top: 20px;

  padding: 10px 20px;

  border: none;

  border-radius: 10px;

  cursor: pointer;
}

.gift-caindo {

  animation: cairFora 0.2s ease-in forwards;
}
@keyframes cairFora {

  0% {

    transform: translateY(0px);

    opacity: 1;
  }

  100% {

    transform: translateY(900px);

    opacity: 0;
  }

}

#overlay {

  position: fixed;

  inset: 0;

  background:

    radial-gradient(
      circle at center,
      rgba(120,40,120,0.15) 0%,
      rgba(20,0,40,0.55) 70%
    ),

    linear-gradient(
      180deg,
      rgba(40,0,60,0.45),
      rgba(20,0,30,0.6)
    );

  z-index: -1;

  pointer-events: none;
}



#snoopy {

  filter:
    drop-shadow(0 0 25px rgba(255,255,255,0.08))
    drop-shadow(0 0 60px rgba(255,180,255,0.08));
    object-fit: contain;
}
.particle {

  position: fixed;

  width: 2px;
  height: 2px;

  background: rgba(255,255,255,0.18);

  border-radius: 50%;

  pointer-events: none;

  z-index: 1;

  animation: subir linear forwards;
}

@keyframes subir {

  from {

    transform: translateY(0px);

    opacity: 0;
  }

  15% {

    opacity: 1;
  }

  100% {

    transform: translateY(-120vh);

    opacity: 0;
  }

}


#giftBox {

  filter:
    drop-shadow(0 0 20px rgba(255,180,180,0.4));
}

#musicSelector {

  position: fixed;

  right: 20px;
  bottom: -120px;

  width: 320px;
  height: 320px;

  z-index: 300;
}

.cd {
pointer-events: auto;
  clip-path: circle(42%);
  position: absolute;

  width: 180px;

  bottom: 0;

  cursor: pointer;

  transition:
    transform 0.35s ease,
    bottom 0.35s ease,
    filter 0.35s ease;

  filter:
    drop-shadow(0 0 15px rgba(0,0,0,0.4));
}



/* POSIÇÕES INICIAIS */

.cd1 {

  right: 0;
  z-index: 3;
}

.cd2 {

  right: 60px;
  z-index: 2;
}

.cd3 {

  right: 120px;
  z-index: 1;
}
/* QUANDO PASSA NO CONTAINER */

#musicSelector:hover .cd {

  bottom: 80px;
}
/* CD ESPECÍFICO SE DESTACA */

#musicSelector .cd:hover {

  transform: translateY(-35px) scale(1.05);

  filter:
    drop-shadow(0 0 20px rgba(255,255,255,0.25));
}



/* CDs NÃO SELECIONADOS DESCEM */

#musicSelector:hover .cd:not(:hover) {

  transform: translateY(-10px);
}


.flor {

  position: fixed;

  width: 220px;

  z-index: 20;

  cursor: pointer;

  transition: transform 0.2s ease;

  user-select: none;
}

.flor-topo {

  top: -30px;
  right: -50px;
}

.flor-baixo {

  bottom: -130px;
  left: -60px;

}



/* ANIMAÇÃO SQUISH */

.flor-squish {

  animation: squishFlor 0.45s ease;
}

@keyframes squishFlor {

  0% {

    transform: scale(1);
  }

  30% {

    transform: scaleX(1.12) scaleY(0.85);
  }

  60% {

    transform: scaleX(0.92) scaleY(1.08);
  }

  100% {

    transform: scale(1);
  }

}



/* PARTÍCULAS */

.petala {

  position: fixed;

  width: 8px;
  height: 8px;

  background: #ffd84d;

  border-radius: 50%;

  pointer-events: none;

  z-index: 100;

  animation: petalaVoando 1.2s ease-out forwards;
}

@keyframes petalaVoando {

  0% {

    opacity: 1;

    transform:
      translate(0px, 0px)
      scale(1);
  }

  100% {

    opacity: 0;

    transform:
      translate(var(--x), var(--y))
      scale(0.2);
  }

}

.polaroid {

  position: fixed;

  width: 150px;

  z-index: 15;

  user-select: none;

  pointer-events: none;

  filter:
    drop-shadow(0 10px 25px rgba(0,0,0,0.45));

  transition:
    transform 0.4s ease,
    filter 0.4s ease;
}
/* SUPERIOR ESQUERDA */

.polaroid1 {

  top: -0px;
  left: -15px;

  transform:
    rotate(-12deg);
}

/* INFERIOR DIREITA */

.polaroid2 {

  bottom: -45px;
  right: -25px;

  transform:
    rotate(9deg);
}
.polaroid1 {

  animation: flutuarPolaroid1 7s ease-in-out infinite;
}

.polaroid2 {

  animation: flutuarPolaroid2 8s ease-in-out infinite;
}

@keyframes flutuarPolaroid1 {

  0% {

    transform:
      rotate(-12deg)
      translateY(0px);
  }

  50% {

    transform:
      rotate(-10deg)
      translateY(-6px);
  }

  100% {

    transform:
      rotate(-12deg)
      translateY(0px);
  }

}

@keyframes flutuarPolaroid2 {

  0% {

    transform:
      rotate(9deg)
      translateY(0px);
  }

  50% {

    transform:
      rotate(11deg)
      translateY(-8px);
  }

  100% {

    transform:
      rotate(9deg)
      translateY(0px);
  }

}

#hintSnoopy {

  position: absolute;

  bottom: 25px;

  left: 50%;

  transform: translateX(-50%);

  color: rgba(255,255,255,0.75);

  font-size: 18px;

  letter-spacing: 1px;

  z-index: 40;

  pointer-events: none;

  opacity: 1;

  transition:
    opacity 2s ease;

  animation: respirarHint 2.5s ease-in-out infinite;
}

@keyframes respirarHint {

  0% {

    transform:
      translateX(-50%)
      translateY(0px);

    opacity: 0.45;
  }

  50% {

    transform:
      translateX(-50%)
      translateY(-4px);

    opacity: 1;
  }

  100% {

    transform:
      translateX(-50%)
      translateY(0px);

    opacity: 0.45;
  }

}
.cd {

  animation: respirarCD 4s ease-in-out infinite;
}

@keyframes respirarCD {

  0% {

    transform: translateY(0px);
  }

  50% {

    transform: translateY(-3px);
  }

  100% {

    transform: translateY(0px);
  }

}
#fullscreenHint {

  position: fixed;

  top: 14px;
  left: 50%;

  transform: translateX(-50%);

  color: rgba(255,255,255,0.35);

  font-size: 13px;

  letter-spacing: 1px;

  z-index: 500;

  pointer-events: none;

    transition:
    opacity 0.6s ease;

}


</style>

</head>
<div id="fullscreenHint">
  Aperte F11 para tela cheia
</div>
<div id="musicSelector">

  <img
    class="cd cd3"
    src="dance.png"
    data-musica="m2.mp3.mp3"
  >

  <img
    class="cd cd1"
    src="fists.png"
    data-musica="m1.mp3.mp3"
  >

  <img
    class="cd cd2"
    src="party.png"
    data-musica="m3.mp3.mp3"
  >

</div>

<audio
  id="bgMusic"
  loop
></audio>

<img
  class="flor flor-topo"
  src="flor1.png"
>

<img
  class="flor flor-baixo"
  src="flor2.png" 
>

<img
  class="polaroid polaroid1"
  src="fotoinv.png"
>

<img
  class="polaroid polaroid2"
  src="olhos.jpg"
>

<body>

<div id="rotateMessage">
  Por favor, vire o celular na horizontal.
</div>

<div id="mainContent">

  <video id="video-fundo" autoplay muted loop playsinline>
    <source src="elatemotalento.mp4.mp4" type="video/mp4">
  </video>
 <div id="overlay"></div>
  <h1>
    Feliz Dia dos Namorados 🤍
  </h1>


 <img id="snoopy" src= 'snoopy parado (1).gif' alt="snoopy">
<div id="hintSnoopy">
  Clique no Snoopy!
</div>

</div>

<script>
let mensagens = [];
function checkOrientation() {

  const rotateMessage = document.getElementById('rotateMessage');
  const main = document.getElementById('mainContent');

  if (
    window.matchMedia("(max-width: 768px) and (orientation: portrait)").matches
  ) {

    rotateMessage.style.display = 'flex';
    main.style.display = 'none';

  } else {

    rotateMessage.style.display = 'none';
    main.style.display = 'flex';

  }
}

window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

checkOrientation();





const snoopy = document.getElementById('snoopy');

let podeClicar = true;
snoopy.addEventListener('click', async () => {

  if (!podeClicar) return;
const hint =
  document.getElementById('hintSnoopy');

if (hint) {

  hint.style.animation = 'none';

  hint.style.opacity = '1';

  requestAnimationFrame(() => {

    hint.style.transition = 'opacity 2s ease';

    hint.style.opacity = '0';

  });

  setTimeout(() => {

    hint.remove();

  }, 2000);

}
  podeClicar = false;
snoopy.src = 'snoopy corre.gif';


  snoopy.style.transition = 'transform 1.2s ease';

  snoopy.style.transform = 'translateX(1200px)';



  await new Promise(resolve => setTimeout(resolve, 1400));


snoopy.style.transition = 'none';

snoopy.style.transform = 'translateX(1400px)';

snoopy.style.opacity = '0';

  await new Promise(resolve => setTimeout(resolve, 1200));

snoopy.style.opacity = '0';

  criarCaixa();

});







function criarCaixa() {

  const giftAntigo = document.getElementById('giftBox');

  if (giftAntigo) {

    giftAntigo.remove();

  }



  const gift = document.createElement('div');

  gift.id = 'giftBox';



  gift.innerHTML = `

    <img
      id="giftImage"
      src='caixa fechada.png'
    >

  `;



  document.body.appendChild(gift);



  void gift.offsetWidth;



  gift.classList.add('gift-voando');



  setTimeout(() => {

    document.getElementById('giftImage').src =
      'caixa aberta.png';



    mostrarTexto();

  }, 1800);

}

function mostrarTexto() {
console.log(mensagens);
  const mensagemAleatoria = mensagens[
    Math.floor(Math.random() * mensagens.length)
  ];



  const texto = document.createElement('div');

  texto.id = 'messageText';



  texto.innerHTML = `

    <div>
      ${mensagemAleatoria}
    </div>

    <button id="closeBox">
      Fechar
    </button>

  `;



  document.body.appendChild(texto);



  setTimeout(() => {

    texto.classList.add('active');

  }, 50);





  document.getElementById('closeBox').addEventListener('click', () => {

   texto.remove();



const gift = document.getElementById('giftBox');

if (gift) {

  const imagem = document.getElementById('giftImage');

  

  imagem.classList.add('gift-caindo');



  setTimeout(() => {

    gift.remove();

  }, 1000);

}


    setTimeout(() => {

  snoopy.style.opacity = '1';

snoopy.src = 'snoopy corre.gif';

  snoopy.style.transition = 'none';

  snoopy.style.transform = 'translateX(-1400px)';



  void snoopy.offsetWidth;



  snoopy.style.transition = 'transform 1.2s ease';

  snoopy.style.transform = 'translateX(0px)';

setTimeout(() => {

  snoopy.src = 'snoopy parado (1).gif';

}, 1200);

  podeClicar = true;

}, 1000);

  });

}
setInterval(() => {

  const particle = document.createElement('div');

  particle.classList.add('particle');



  particle.style.left = Math.random() * window.innerWidth + 'px';

  particle.style.bottom = '-10px';



  const tamanho = Math.random() * 3;

  particle.style.width = tamanho + 'px';

  particle.style.height = tamanho + 'px';



  const duracao = 8 + Math.random() * 10;

  particle.style.animationDuration = duracao + 's';



  const opacidade = 0.05 + Math.random() * 0.2;

  particle.style.background =
    `rgba(255,255,255,${opacidade})`;



  document.body.appendChild(particle);



  setTimeout(() => {

    particle.remove();

  }, duracao * 1000);

}, 120);

const audio = document.getElementById('bgMusic');

const cds = document.querySelectorAll('.cd');

cds.forEach(cd => {

  cd.addEventListener('click', () => {

    const musica = cd.getAttribute('data-musica');

    console.log('Tentando tocar:', musica);

    audio.src = musica;

    audio.volume = 0.5;

    audio.play()
      .then(() => {

        console.log('Tocando');

      })
      .catch(err => {

        console.log('Erro:', err);

      });

  });

});

const flores = document.querySelectorAll('.flor');

flores.forEach(flor => {

  flor.addEventListener('click', () => {

    flor.classList.remove('flor-squish');

    void flor.offsetWidth;

    flor.classList.add('flor-squish');



    criarPetalas(flor);

  });

});



function criarPetalas(flor) {

  const rect = flor.getBoundingClientRect();



  for (let i = 0; i < 14; i++) {

    const petala = document.createElement('div');

    petala.classList.add('petala');



    petala.style.left =
      rect.left + rect.width / 2 + 'px';

    petala.style.top =
      rect.top + rect.height / 2 + 'px';



    const x =
      (Math.random() - 0.5) * 220 + 'px';

    const y =
      (Math.random() - 0.5) * 220 + 'px';



    petala.style.setProperty('--x', x);
    petala.style.setProperty('--y', y);



    document.body.appendChild(petala);



    setTimeout(() => {

      petala.remove();

    }, 1200);

  }

}
async function carregarMensagens() {

  try {

    const resposta =
      await fetch('mensagens.txt');

    const texto =
      await resposta.text();

    mensagens = texto
      .split(';')
      .map(m => m.trim())
      .filter(m => m.length > 0);

    console.log(mensagens);

  } catch (erro) {

    console.log('Erro ao carregar mensagens:', erro);

  }

}
window.onload = async () => {

  await carregarMensagens();

};
window.onload = async () => {

  console.log('Carregando mensagens...');

  await carregarMensagens();

  console.log('Mensagens carregadas:', mensagens);

};

function verificarTelaCheia() {

  const aviso =
    document.getElementById('fullscreenHint');

  const emTelaCheia =
    window.innerHeight === screen.height;

  if (emTelaCheia) {

    aviso.style.opacity = '0';

  } else {

    aviso.style.opacity = '1';

  }

}
setInterval(verificarTelaCheia, 500);
</script>

</body>
</html>
